# Site Settings
title: "个人博客"
description: "个人博客。"
url: "https://your-site.netlify.app"
baseurl: ""
lang: "zh-CN"
timezone: Asia/Shanghai

# Author
author:
  name: "博主"
  bio: "分享文章与日常记录。"
  avatar: "/assets/images/avatar.png"

# Navigation
nav_links:
  - title: "首页"
    url: "/"
    icon: "home"
  - title: "文章"
    url: "/posts/"
    icon: "article"
  - title: "标签"
    url: "/tags/"
    icon: "label"
  - title: "分类"
    url: "/categories/"
    icon: "folder"
  - title: "归档"
    url: "/archives/"
    icon: "inventory_2"
  - title: "动态"
    url: "/updates/"
    icon: "dynamic_feed"
  - title: "友链"
    url: "/links/"
    icon: "link"
  - title: "关于"
    url: "/about/"
    icon: "info"

# Social Links
social:
  github: ""
  navigation: ""
  rss: true

# Build & Markdown
markdown: kramdown
highlighter: rouge
future: true

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Permalink style
permalink: /posts/:slug/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gem"
  - vendor/
  - README.md
  - .github/
  - node_modules/
  - docs/
  - jekyll_blog_netlify_static_migration_plan.md
